<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>FreightWise Programming Test</title>

    <script>
        'use strict';

        /**
         * Software Developer test.
         *
         * Doing research and making API calls are an important part of what we do at FreightWise.  This test will
         * demonstrate your abilities to:
         *
         * - Make an API call
         * - Research an API
         * - Do basic DOM manipulation
         * - Parse data
         * - Handle errors
         * - Be creative
         *
         * Feel free to ask any questions you may have.  Use a lot of comments, and explain why you are doing things.
         * Don't spend more than 1-2 hours on it - we aren't expecting a finished product, but it should work and look
         * nice.  Feel free to use any third party libraries, and if you do so, explain why you used them instead of
         * built in browser APIs.
         *
         * Instructions:
         * - Use the axios (https://github.com/axios/axios) request library to make an API call to the OpenWeatherMap
         *   API for Current Weather Data using this API key:  25e989bd41e3e24ce13173d8126e0fd6
         *   We've already imported this library to get you started.
         * - Use either async/await or Promises.
         * - Get the weather for Brentwood, TN, and write it to the DOM using the `setResults` method below.  Be
         *   creative and make it look nice.
         * - Handle errors and use the `setError` method below to display the error.  Also make it look nice.
         * - If you find any mistakes in the test, fix them, and leave a comment about what you fixed and why.
         * - Make sure your code is readable and maintainable.
         * - Use plenty of descriptive comments.
         * - Make sure your code runs in the latest version of Google Chrome and Firefox (ES6 is allowed).
         * - Make your code live (GitHub with GitHub pages works nice).
         * - Send a link to your finished test to dev-team-jobs@freightwisellc.com.
         *
         * Feel free to add your own twist to it (completely optional).  Here are a few ideas:
         * - Sign up for NewsAPI.org and get the Top Headlines and show them along with the weather.
         * - Use the browser location API to get the user's current location, and show that location's weather.
         * - Show a satellite map of the weather in Brentwood.
         * - Request a user's phone number and send them an SMS with the weather.
         */
        class Test {
            constructor() {
                this.testResults = document.getElementsByClassName('test-results')[0]; // Added the [0] index to properly target the element.
            }

            async run() {
                console.log(new Date().toISOString(), '[Test]', 'Running the test');

                // Initialized theHTML variable before use in the API call.
                let theHTML = '';

                // Added an array to convert wind direction degrees to cardinal directions.
                const windDirections = ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'];

                // The included API key was responding as invalid. So, I created my own account and key to use here.
                await axios.get('https://api.openweathermap.org/data/2.5/weather?q=Brentwood,TN-US&units=imperial&appid=a5ebb7e07236d990b457d030713115d3')
                    .then(response => {
                        const theData = response.data;
                        // In lieu of using a typical component-based element, I opted to create a quick and simple HTML template for the output here.
                        // Originally, I had a more simple and informational output in a list, but I wanted to change it to a more conversational tone and layout for the sake of the user's experience.
                        // I also rounded the numerical data points to be more user-friendly.
                        theHTML = `
                            <div class="results_wrapper">
                                <h2 class="results_title">Here's the current weather${theData?.name ? ' for ' + theData.name : ''}.</h2>
                                ${theData?.main?.temp ? `<p class="current_temp">${Math.round(theData.main.temp)}°F.</p>` : ''}
                                ${theData?.weather[0]?.description ? `<p class="weather_description">${theData.weather[0].description}</p>` : ''}
                                ${theData.weather[0].icon ? ` <span class="icon_wrapper"><img src="http://openweathermap.org/img/wn/${theData.weather[0].icon}.png" alt="${theData.weather[0].description}" class="icon" /></span>` : ''}
                                ${theData?.main?.feels_like ? `<p>The current feels like temperature is ${Math.round(theData.main.feels_like)}°F${theData?.main?.humidity ? ` with humidity at ${theData.main.humidity}%.` : ''}</p>`: ''}
                                ${theData?.wind?.speed ? `<p>Winds at ${Math.round(theData.wind.speed)} mph${theData.wind.deg ? ` from the ${windDirections[Math.floor((theData.wind.deg + 22.5) / 45) % 8]}` : ''}.</p>` : ''}
                            </div>
                        `;
                        this.setResults(theHTML);
                    })
                    .catch(error => {
                        // Used same HTML "template" as above. Gave the user a more friendly message upon error and sent the technical data to the console for debugging.
                        console.error('--> API call failed:\n', error);
                        theHTML = `
                            <div class="results_wrapper">
                                <h2 class="results_title">No Weather Found!</h2>
                                <p>Whoops! I guess you found somewhere without weather. Please, try again later.</p>
                            </div>
                        `;
                        this.setError(theHTML);
                    });
            }

            setError(message) {
                this.testResults.innerHTML = message || ''; // Reconfigured to allow for HTML formatting in the error message.
            }

            setResults(results) {
                this.testResults.innerHTML = results || ''; // Reconfigured to allow for HTML formatting in the error message.
            }
        }
    </script>

    <style>
        /* Default Styles ========== */
        html, body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #eee;
        }

        /* Results Styles ========== */
        .test-results {
            text-align: center;
        }
        .test-results .results_wrapper {
            background-color: #008000; /* Matched green from button for visual consistency with existing button. */
            border-radius: 4px;
            border: 1px solid #bcb;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.05);
            margin: 0 auto 20px;
            max-width: 80%;
            padding: 2rem 1.5rem;
            width: 600px;
        }
        .test-results .results_title {
            color: #fff;
            font-size: 1.75rem;
            margin: 0 0 1em;
        }
        .test-results p {
            color: #eef; /* Used a subtle green tint to the text. */
            font-size: 1rem;
            line-height: 1.5;
            margin: 0 0 .5em;
        }
        /* Specific element styles */
        .test-results .current_temp {
            font-size: 1.5rem;
            line-height: 1em;
            margin: 0 0 .25em;
        }
        .test-results .weather_description {
            margin: 0;
            text-transform: capitalize;
        }
        .test-results .icon_wrapper {
            display: block;
            height: 3rem;
        }
        .test-results .icon_wrapper .icon {
            height: 100%;
            width: auto;
        }

        /* Button Styles ========== */
        .button-container {
            text-align: center;
        }
        .button-container > button {
            background-color: #008000;
            border-radius: 3px;
            border: none;
            color: white;
            cursor: pointer; /* Added to show user they can click it. */
            font-size: 14px;
            margin: 0;
            padding: 10px 18px;
            transition: all 200ms ease-in-out;
        }
        .button-container > button:hover {
            background-color: #00A000;
        }
        .button-container > button:active {
            background-color: #006000;
        }
    </style>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="test-results"></div>

    <div class="button-container"></div>

    <script>
        'use strict';

        /**
         * Creates a button for kicking off the test and adds it to the DOM.
         *
         * @param {HTMLElement} context  the parent element to add the button to
         * @param {Test}        test     the test to be executed
         * @returns {HTMLElement} the button added to the test
         */
        function addButtonForTest(context, test) {
            let testButton = document.createElement('button');

            testButton.type = 'button';
            testButton.innerText = 'Get the Weather for Brentwood, TN'; // Renamed city text to match API call.
            testButton.onclick = () => test.run();

            context.appendChild(testButton);

            return testButton;
        }

        // Create the Test and add a button to the UI for running the test
        const test = new Test();
        const buttonContainer = document.getElementsByClassName('button-container')[0];

        addButtonForTest(buttonContainer, test);
    </script>
</body>
</html>
